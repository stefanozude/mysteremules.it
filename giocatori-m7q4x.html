<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Area riservata · Mystere Mules</title>
<link rel="icon" type="image/png" href="img/logo-icon.png">
<style>
@font-face{font-family:'Barlow Condensed';font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
:root{--green:#00471B;--green-2:#0B5A2A;--red:#D70408;--cream:#E0D2C5;--ink:#141414;--ink-2:#3C3A36;--muted:#5C5A55;--line:#E4E2DD;--stone:#F4F2EE;--photo:#F2F1EE;--white:#fff;--black:#0B0B0B;
--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:Barlow,'Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink);background:var(--white)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:2px solid transparent;cursor:pointer;background:var(--green);color:var(--white)}
.btn:hover{background:var(--green-2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.outline{background:var(--white);color:var(--ink);border-color:#C9C6BF}
.btn.big{width:100%;min-height:56px;font-size:21px}
/* lock */
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--green);padding:24px 16px}
.lock-box{width:100%;max-width:380px;text-align:center;color:var(--white)}
.lock-box img{width:120px;margin:0 auto 18px}
.lock-box h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em}
.lock-box p{margin:0 0 20px;color:var(--cream);font-size:15px}
.lock-box input{width:100%;min-height:52px;font:inherit;font-size:18px;padding:10px 14px;border:0;margin-bottom:10px;text-align:center}
.lock-box .btn{width:100%;background:var(--black)}
.lock-box .err{color:#FFD2D2;min-height:22px;margin:10px 0 0;font-weight:600}
.lock-box label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:14px;color:var(--cream);margin-bottom:12px}
.lock-box label input{width:20px;height:20px;min-height:0;margin:0;padding:0;accent-color:var(--black)}
/* page */
.top{background:var(--green);color:var(--white);padding:28px 0}
.top-in{display:flex;gap:20px;align-items:center}
.top .logo{width:88px;flex:none}
.kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cream);font-size:15px}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;margin:4px 0 8px;text-transform:uppercase}
.sub{margin:0;font-size:14px;color:#D9E4DC}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.howto div{background:var(--stone);padding:12px;font-size:14px;font-weight:600}
.howto b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;align-items:center;justify-content:center;margin-right:6px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 22px;margin-bottom:40px}
.card{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-bottom:22px}
.card .ph{background:var(--photo);aspect-ratio:1/1;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.card h3{margin:0;font-size:20px;line-height:1.2}
.card .desc{margin:0;font-size:14px;color:var(--ink-2)}
.price{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;color:var(--green)}
.price.soon{font-size:22px;color:var(--muted);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field select,.field input,.field textarea{min-height:44px;font:inherit;font-size:16px;padding:8px 10px;border:1px solid #B9B5AD;background:var(--white);color:var(--ink);border-radius:0;width:100%}
.field input.short{width:84px}
.swatches{display:flex;flex-wrap:wrap;gap:4px}
.sw{width:40px;height:40px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;border:2px solid transparent;background:transparent;cursor:pointer}
.sw span{width:26px;height:26px;border-radius:50%;border:1px solid #8A8780;display:block}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--green)}
.add.done{background:var(--ink)}
.add.warn{background:var(--red)}
.small{font-size:13px;color:var(--muted)}
.order{background:var(--stone);padding:26px 16px;margin:0 -16px 40px}
@media(min-width:720px){.order{margin:0 0 40px;padding:32px}}
.order h2{font-family:var(--display);font-weight:800;font-size:36px;text-transform:uppercase;margin:0 0 12px;line-height:1}
.cart{list-style:none;margin:0 0 12px;padding:0}
.cart li{display:flex;gap:12px;align-items:center;background:var(--white);padding:12px;margin-bottom:6px}
.cart li div{flex:1;min-width:0}
.cart .meta{display:block;font-size:13px;color:var(--muted)}
.cart .lp{font-weight:700;white-space:nowrap}
.cart button{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--muted);min-width:36px;min-height:36px}
.total{font-size:20px;margin:6px 0 22px}
.total b{font-family:var(--display);font-size:32px;color:var(--green);margin-left:6px}
form{display:flex;flex-direction:column;gap:12px;max-width:640px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row .grow{flex:1 1 220px}
.msg{min-height:20px;margin:0;font-weight:600}.msg.err{color:var(--red)}
.fallback{background:var(--white);padding:14px;display:flex;flex-direction:column;gap:10px}
.fallback p{margin:0}
.done{background:var(--white);padding:20px}
.done h3{font-family:var(--display);font-size:30px;margin:0 0 6px;color:var(--green);text-transform:uppercase}
.done pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--stone);padding:12px}
.fab{position:fixed;right:16px;bottom:16px;background:var(--red);color:#fff;text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-transform:uppercase}
.foot{background:var(--black);color:#A9A59E;font-size:13px;padding:22px 0}
@media(max-width:560px){.card .ph{aspect-ratio:4/3}.howto{grid-template-columns:1fr}.top-in{flex-direction:column;align-items:flex-start;gap:12px}.top .logo{width:70px}}
</style>
</head>

(function(){
  function b64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function norm(p){ return String(p||'').trim().toLowerCase(); }
  function unlock(pw){
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(norm(pw)), 'PBKDF2', false, ['deriveKey'])
      .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.i, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['decrypt']); })
      .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.v)}, key, b64(ENC.c)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function show(d){
    document.getElementById('lock').hidden = true;
    document.getElementById('app').innerHTML = d.html;
    (new Function(d.js))();
  }
  var KEY = 'mm-riservato-pw';
  try { var saved = localStorage.getItem(KEY); if (saved) unlock(saved).then(show, function(){ try{localStorage.removeItem(KEY);}catch(e){} }); } catch(e){}
  document.getElementById('lock-form').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = document.getElementById('pw').value, err = document.getElementById('pw-err'), go = document.getElementById('pw-go');
    if (!window.crypto || !crypto.subtle){ err.textContent = 'Apri la pagina con Chrome o Safari aggiornati.'; return; }
    go.disabled = true; err.textContent = '';
    unlock(pw).then(function(d){
      try { if (document.getElementById('remember').checked) localStorage.setItem(KEY, norm(pw)); } catch(e){}
      show(d);
    }, function(){ err.textContent = 'Password errata, riprova.'; go.disabled = false; });
  });
})();
